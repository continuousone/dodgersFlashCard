<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Card Quiz</title>
    <link rel="stylesheet" href="styles-new.css">
</head>
<body>
    <div class ="flashcard-container">

        <div class="logo">
            <img src="Dodgers_Logo.png" alt="dodgers logo">
        </div>
        <h1>Fun Facts</h1>
        <div id="flashcard" class="flashcard">
            <div class="front">
                <p id="question">Question will go here.</p>
            </div>
            <div class="back">
                <p id="answer">Answers will go here.</p>
            </div>

        </div>
        <div>
            <button id="flip-card">Flip Card</button>
            <button id="next-card">Next</button>
        </div>
    </div>

<script src="script-new.js"></script>
</body>
</html>
